apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskmanagement-app
spec:
  replicas: 2
  progressDeadlineSeconds: 30
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: taskmanagement-app
  template:
    metadata:
      labels:
        app: taskmanagement-app
    spec:
      containers:
      - name: app
        image: taskmanagement-app:IMAGE_TAG
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 3
          failureThreshold: 2