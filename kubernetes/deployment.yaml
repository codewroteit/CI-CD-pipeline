apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskmanagement-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskmanagement-app
  template:
    metadata:
      labels:
        app: taskmanagement-app
    spec:
      containers:
        - name: taskmanagement-app
          image: taskmanagement-app:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000